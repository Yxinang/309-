<!-- 1. 家長端：在校健康與傷病通知卡片（確保完整顯示、不被固定列遮擋） -->
<section id="parentHealthCard" class="bg-white rounded-2xl p-4 md:p-5 card-shadow border border-slate-100 space-y-2.5">
  <div class="flex items-center gap-2 text-rose-700 font-bold text-sm">
    <div class="p-1.5 bg-rose-50 rounded-lg"><i data-lucide="heart-pulse" class="w-4 h-4"></i></div>
    <span>在校健康與傷病通知</span>
  </div>
  <div id="parentHealthNote" class="text-sm text-slate-700 bg-rose-50/60 border border-rose-200/70 p-3.5 rounded-xl leading-relaxed min-h-[3.5rem] whitespace-pre-line">
    今日在校健康狀況良好，無傷病紀錄。
  </div>
</section>

<!-- 2. 家長端：確認與取消確認按鈕區（改為一般排版，避免遮擋下方內容） -->
<div class="pt-2 space-y-2">
  <button id="confirmBtnMain" type="button" onclick="confirmByParent()" class="w-full py-3.5 rounded-xl font-bold text-base shadow-md transition flex items-center justify-center gap-2 bg-teal-600 hover:bg-teal-700 text-white">
    我已閱讀並確認
  </button>
  <button id="cancelConfirmBtn" type="button" onclick="cancelParentConfirm()" class="hidden w-full py-2.5 rounded-xl font-bold text-sm border border-rose-300 bg-rose-50 hover:bg-rose-100 text-rose-700 transition">
    不小心按錯了？取消已確認狀態
  </button>
</div>

<script>
  // 取消家長已確認狀態並同步至雲端
  window.cancelParentConfirm = function () {
    if (!authSession || authSession.role !== "parent") return;
    const student = CLASS_STUDENTS.find((s) => s.id === authSession.studentId);
    if (!student) return;

    const dayRec = ensureDateRecord(selectedDate);
    const stRec = dayRec.studentRecords[student.id];
    stRec.confirmed = false;
    stRec.confirmedTime = "";

    saveState();
    renderParentView(student);
    showToast("已取消確認狀態，目前為「待確認」");
  };

  // 在 renderParentView(student) 內呼叫此函式更新按鈕與傷病通知顯示
  function syncConfirmAndHealthUI(stRec) {
    const healthEl = document.getElementById("parentHealthNote");
    if (healthEl) {
      healthEl.textContent = (stRec && stRec.healthNote && stRec.healthNote.trim())
        ? stRec.healthNote
        : "今日在校健康狀況良好，無傷病紀錄。";
    }

    const confirmBtn = document.getElementById("confirmBtnMain");
    const cancelBtn = document.getElementById("cancelConfirmBtn");
    if (!confirmBtn || !cancelBtn) return;

    if (stRec && stRec.confirmed) {
      confirmBtn.className = "w-full py-3.5 rounded-xl font-bold text-base bg-emerald-50 text-emerald-700 border-2 border-emerald-500 flex items-center justify-center gap-2";
      confirmBtn.textContent = `家長已完成確認 (${stRec.confirmedTime})`;
      cancelBtn.classList.remove("hidden");
    } else {
      confirmBtn.className = "w-full py-3.5 rounded-xl font-bold text-base bg-teal-600 hover:bg-teal-700 text-white shadow-md transition flex items-center justify-center gap-2";
      confirmBtn.textContent = `我已閱讀並確認 (${selectedDate})`;
      cancelBtn.classList.add("hidden");
    }
  }
</script>
